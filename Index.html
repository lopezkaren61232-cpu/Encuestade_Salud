<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Salud</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .rango-valor {
            margin-top: 0.5rem;
            color: #2c3e50;
        }
        button {
            background-color: #27ae60;
            color: white;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

    <h1>Encuesta de Salud</h1>
    <form action="#" method="POST">

        <!-- Edad: input number con rango -->
        <div class="form-group">
            <label for="edad">Edad (entre 1 y 120 años):</label>
            <input type="number" id="edad" name="edad" min="1" max="120" required>
        </div>

        <!-- Peso: input number con rango -->
        <div class="form-group">
            <label for="peso">Peso en kg (entre 2 y 300 kg):</label>
            <input type="number" id="peso" name="peso" min="2" max="300" step="0.1" required>
        </div>

        <!-- Altura: input number con rango -->
        <div class="form-group">
            <label for="altura">Altura en cm (entre 50 y 250 cm):</label>
            <input type="number" id="altura" name="altura" min="50" max="250" required>
        </div>

        <!-- Nivel de dolor: input range -->
        <div class="form-group">
            <label for="dolor">Nivel de dolor (0 = sin dolor, 10 = dolor máximo):</label>
            <input type="range" id="dolor" name="dolor" min="0" max="10" value="0" oninput="mostrarValorDolor(this.value)">
            <div class="rango-valor">Valor seleccionado: <span id="valorDolor">0</span></div>
        </div>

        <!-- Tipo de sangre: select -->
        <div class="form-group">
            <label for="sangre">Tipo de sangre:</label>
            <select id="sangre" name="sangre" required>
                <option value="">-- Selecciona una opción --</option>
                <option value="A+">A Positivo (A+)</option>
                <option value="A-">A Negativo (A-)</option>
                <option value="B+">B Positivo (B+)</option>
                <option value="B-">B Negativo (B-)</option>
                <option value="AB+">AB Positivo (AB+)</option>
                <option value="AB-">AB Negativo (AB-)</option>
                <option value="O+">O Positivo (O+)</option>
                <option value="O-">O Negativo (O-)</option>
                <option value="desconocido">No lo sé / Desconocido</option>
            </select>
        </div>

        <button type="submit">Enviar Encuesta</button>

    </form>

    <script>
        // Función para mostrar el valor del rango de dolor
        function mostrarValorDolor(valor) {
            document.getElementById('valorDolor').textContent = valor;
        }
    </script>

</body>
                  </html>
